<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Download Manager</title>

    <style>
        body {
            width: 320px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
        }

        .info {
            margin-top: 10px;
        }

        .label {
            font-weight: bold;
        }

        #message {
            color: #666;
        }
    </style>
</head>

<body>

<h2>Download Manager</h2>

<div id="message">
    No download detected yet.
</div>

<div class="info">
    <p>
        <span class="label">ID:</span>
        <span id="downloadId">-</span>
    </p>

    <p>
        <span class="label">URL:</span>
        <span id="downloadUrl">-</span>
    </p>

    <p>
        <span class="label">Filename:</span>
        <span id="downloadFilename">-</span>
    </p>
</div>

<script src="popup.js"></script>

</body>
</html>
